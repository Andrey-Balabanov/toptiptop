<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520">
  <!-- Clinic: medical crosses, a DNA helix and pills -->
  <g fill="#4fd8c4" fill-opacity="0.08">
    <path d="M60 40 h24 v24 h24 v24 h-24 v24 h-24 v-24 h-24 v-24 h24 Z"/>
    <path d="M470 330 h16 v16 h16 v16 h-16 v16 h-16 v-16 h-16 v-16 h16 Z"/>
    <path d="M300 440 h12 v12 h12 v12 h-12 v12 h-12 v-12 h-12 v-12 h12 Z"/>
  </g>
  <!-- DNA helix -->
  <g transform="translate(400 30)" fill="none" stroke-width="2">
    <path d="M0 0 C 40 30, 40 60, 0 90 S -40 150, 0 180 S 40 240, 0 270" stroke="#4fd8c4" stroke-opacity="0.18"/>
    <path d="M40 0 C 0 30, 0 60, 40 90 S 80 150, 40 180 S 0 240, 40 270" transform="translate(-40 0)" stroke="#ff5a6e" stroke-opacity="0.14"/>
    <g stroke="#e6f6f4" stroke-opacity="0.08">
      <path d="M8 20 H-8"/><path d="M20 45 H-20"/><path d="M8 70 H-8"/><path d="M-8 110 H8"/><path d="M-20 135 H20"/><path d="M-8 160 H8"/>
      <path d="M8 200 H-8"/><path d="M20 225 H-20"/><path d="M8 250 H-8"/>
    </g>
  </g>
  <!-- Pills -->
  <g transform="translate(120 300) rotate(-30)">
    <rect x="-30" y="-11" width="60" height="22" rx="11" fill="none" stroke="#4fd8c4" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M0 -11 v22" stroke="#4fd8c4" stroke-opacity="0.18" stroke-width="2"/>
  </g>
  <circle cx="200" cy="380" r="12" fill="none" stroke="#e6f6f4" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M192 380 h16" stroke="#e6f6f4" stroke-opacity="0.12" stroke-width="2"/>
  <!-- Stethoscope -->
  <g fill="none" stroke="#e6f6f4" stroke-opacity="0.1" stroke-width="3" stroke-linecap="round" transform="translate(180 60)">
    <path d="M0 0 v40 a30 30 0 0 0 60 0 v-40"/>
    <path d="M30 70 v40 a30 30 0 0 0 60 0 v-20"/>
    <circle cx="90" cy="80" r="10"/>
  </g>
  <text x="40" y="490" font-family="SF Mono, Menlo, monospace" font-size="12" fill="#4fd8c4" fill-opacity="0.18">BP 120/80 · SpO₂ 98% · HR 72</text>
