<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560">
  <!-- Front page: masthead, headlines, column text and a photo block -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ececec">
    <text x="30" y="70" font-size="44" font-weight="bold" fill-opacity="0.07">THE DAILY TYPE</text>
    <text x="30" y="150" font-size="26" font-weight="bold" fill-opacity="0.1">LOCAL HERO HITS 120 WPM</text>
    <text x="360" y="360" font-size="20" font-weight="bold" fill-opacity="0.09">Keyboards sold out</text>
    <text x="30" y="96" font-size="11" fill-opacity="0.12" letter-spacing="2">VOL. XLII · EVENING EDITION · PRICE 10¢</text>
  </g>
  <rect x="30" y="104" width="580" height="2" fill="#ececec" fill-opacity="0.08"/>
  <!-- BREAKING stamp -->
  <g transform="translate(470 210) rotate(-12)">
    <rect x="-70" y="-22" width="140" height="44" rx="4" fill="none" stroke="#e63946" stroke-opacity="0.3" stroke-width="3"/>
    <text x="0" y="9" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="24" fill="#e63946" fill-opacity="0.3">BREAKING</text>
  </g>
  <!-- Column text as grey bars -->
  <g fill="#ececec" fill-opacity="0.06">
    <rect x="30" y="180" width="150" height="5"/><rect x="30" y="192" width="140" height="5"/><rect x="30" y="204" width="150" height="5"/>
    <rect x="30" y="216" width="120" height="5"/><rect x="30" y="228" width="150" height="5"/><rect x="30" y="240" width="146" height="5"/>
    <rect x="30" y="252" width="150" height="5"/><rect x="30" y="264" width="90" height="5"/>
    <rect x="200" y="180" width="150" height="5"/><rect x="200" y="192" width="150" height="5"/><rect x="200" y="204" width="132" height="5"/>
    <rect x="200" y="216" width="150" height="5"/><rect x="200" y="228" width="148" height="5"/><rect x="200" y="240" width="150" height="5"/>
    <rect x="200" y="252" width="110" height="5"/>
    <rect x="360" y="380" width="250" height="5"/><rect x="360" y="392" width="240" height="5"/><rect x="360" y="404" width="250" height="5"/>
    <rect x="360" y="416" width="200" height="5"/><rect x="360" y="428" width="250" height="5"/><rect x="360" y="440" width="170" height="5"/>
  </g>
  <!-- Photo block with halftone dots -->
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#ececec" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect x="30" y="300" width="300" height="190" fill="url(#dots)"/>
  <rect x="30" y="300" width="300" height="190" fill="none" stroke="#ececec" stroke-opacity="0.1"/>
  <text x="30" y="510" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#ececec" fill-opacity="0.14">Photo: our correspondent at the keyboard</text>
</svg>
