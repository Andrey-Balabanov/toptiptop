<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520">
  <!-- Ledger: number columns, totals, a bar chart and a calculator -->
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="13" fill="#4fd1a5" text-anchor="end">
    <g fill-opacity="0.2">
      <text x="140" y="44">1 024.50</text><text x="140" y="68">  318.00</text><text x="140" y="92">2 760.15</text>
      <text x="140" y="116">   47.99</text><text x="140" y="140">9 100.00</text>
    </g>
    <line x1="60" y1="150" x2="140" y2="150" stroke="#4fd1a5" stroke-opacity="0.25"/>
    <text x="140" y="170" fill="#f2c14e" fill-opacity="0.3">Σ 13 250.64</text>
    <g fill-opacity="0.14">
      <text x="560" y="300">+12.4 %</text><text x="560" y="324">−3.1 %</text><text x="560" y="348">+0.8 %</text>
      <text x="560" y="372">VAT 20 %</text>
    </g>
    <g fill-opacity="0.12">
      <text x="220" y="460">DEBIT    CREDIT</text><text x="220" y="484">  500.00      —</text>
    </g>
  </g>
  <g font-family="Georgia, serif" fill="#f2c14e" fill-opacity="0.08">
    <text x="300" y="120" font-size="90">$</text>
    <text x="420" y="200" font-size="70">€</text>
    <text x="40" y="330" font-size="80">%</text>
    <text x="490" y="470" font-size="64">¥</text>
  </g>
  <!-- Bar chart -->
  <g fill="#4fd1a5" fill-opacity="0.1" transform="translate(230 270)">
    <rect x="0" y="60" width="18" height="60"/><rect x="26" y="30" width="18" height="90"/>
    <rect x="52" y="76" width="18" height="44"/><rect x="78" y="8" width="18" height="112"/>
    <path d="M0 120 H110" stroke="#4fd1a5" stroke-opacity="0.2"/>
    <path d="M9 55 L35 25 L61 70 L87 3" fill="none" stroke="#f2c14e" stroke-opacity="0.25" stroke-width="2"/>
  </g>
  <!-- Calculator -->
  <g transform="translate(430 30)" fill="none" stroke="#4fd1a5" stroke-opacity="0.16">
    <rect width="96" height="130" rx="8"/>
    <rect x="10" y="10" width="76" height="24" rx="3"/>
    <g>
      <rect x="10" y="44" width="16" height="14" rx="2"/><rect x="30" y="44" width="16" height="14" rx="2"/><rect x="50" y="44" width="16" height="14" rx="2"/><rect x="70" y="44" width="16" height="14" rx="2"/>
      <rect x="10" y="64" width="16" height="14" rx="2"/><rect x="30" y="64" width="16" height="14" rx="2"/><rect x="50" y="64" width="16" height="14" rx="2"/><rect x="70" y="64" width="16" height="14" rx="2"/>
      <rect x="10" y="84" width="16" height="14" rx="2"/><rect x="30" y="84" width="16" height="14" rx="2"/><rect x="50" y="84" width="16" height="14" rx="2"/><rect x="70" y="84" width="16" height="34" rx="2"/>
      <rect x="10" y="104" width="56" height="14" rx="2"/>
    </g>
  </g>
</svg>
