<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560">
  <!-- Writer's desk: big serif letters, a quill, ink blots and a coffee ring -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e8c07a">
    <text x="40" y="150" font-size="140" fill-opacity="0.06" font-style="italic">A</text>
    <text x="430" y="210" font-size="110" fill-opacity="0.05">¶</text>
    <text x="250" y="470" font-size="120" fill-opacity="0.05" font-style="italic">&amp;</text>
    <text x="500" y="500" font-size="70" fill-opacity="0.06">“</text>
    <text x="60" y="330" font-size="16" fill-opacity="0.16" font-style="italic">It was a dark and stormy night...</text>
    <text x="300" y="300" font-size="15" fill-opacity="0.12" font-style="italic">Chapter I</text>
    <text x="60" y="520" font-size="14" fill-opacity="0.12" font-style="italic">— and then, at last, she wrote the final word.</text>
  </g>
  <!-- Handwritten lines -->
  <g fill="none" stroke="#e8c07a" stroke-opacity="0.1" stroke-width="1.6" stroke-linecap="round">
    <path d="M60 360 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path d="M60 380 q20 -8 40 0 t40 0 t40 0 t40 0"/>
    <path d="M60 400 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  </g>
  <!-- Quill -->
  <g transform="translate(470 250) rotate(35)" fill="#efe3cf" fill-opacity="0.09" stroke="#efe3cf" stroke-opacity="0.16">
    <path d="M0 0 C 30 -40, 70 -110, 60 -170 C 40 -120, 20 -70, 0 0 Z"/>
    <path d="M0 0 L 50 -150" fill="none"/>
    <path d="M0 0 L -6 18" stroke-width="2"/>
  </g>
  <!-- Ink blots -->
  <g fill="#d9a35b" fill-opacity="0.1">
    <circle cx="455" cy="290" r="9"/><circle cx="470" cy="300" r="4"/><circle cx="440" cy="302" r="3"/>
  </g>
  <!-- Coffee ring -->
  <g fill="none" stroke="#b07a3c" stroke-opacity="0.13">
    <circle cx="180" cy="210" r="46" stroke-width="5"/>
    <circle cx="183" cy="207" r="40" stroke-width="1.5" stroke-opacity="0.08"/>
  </g>
</svg>
