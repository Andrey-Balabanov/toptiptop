<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560">
  <!-- Law library: scales of justice, a column, section signs and Latin maxims -->
  <g fill="none" stroke="#c9a227" stroke-opacity="0.2" stroke-width="2" stroke-linecap="round" transform="translate(150 60)">
    <path d="M60 0 v150"/><path d="M20 160 h80"/><path d="M0 30 h120"/>
    <circle cx="60" cy="24" r="6"/>
    <path d="M0 30 l-22 60 h44 Z"/><path d="M-26 90 q26 22 52 0"/>
    <path d="M120 30 l-22 60 h44 Z"/><path d="M94 90 q26 22 52 0"/>
  </g>
  <!-- Doric column -->
  <g fill="none" stroke="#e9dcc4" stroke-opacity="0.08" stroke-width="2" transform="translate(470 220)">
    <path d="M-10 0 h90 M-4 10 h78 M0 10 v220 M70 10 v220 M17 14 v214 M35 14 v214 M53 14 v214 M-4 230 h78 M-10 240 h90"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#c9a227">
    <text x="40" y="330" font-size="120" fill-opacity="0.06">§</text>
    <text x="330" y="140" font-size="70" fill-opacity="0.06">§</text>
    <text x="40" y="420" font-size="16" fill-opacity="0.18" letter-spacing="3">DURA LEX, SED LEX</text>
    <text x="40" y="460" font-size="14" fill-opacity="0.14" font-style="italic">Audiatur et altera pars</text>
    <text x="210" y="520" font-size="13" fill-opacity="0.12" letter-spacing="2">ART. 1 · § 2 · CLAUSE 3(b)</text>
  </g>
  <!-- Gavel -->
  <g transform="translate(330 300) rotate(-35)" fill="#c9a227" fill-opacity="0.1" stroke="#c9a227" stroke-opacity="0.18">
    <rect x="-30" y="-14" width="60" height="28" rx="5"/>
    <rect x="-4" y="14" width="8" height="80" rx="3"/>
  </g>
</svg>
